<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DB Message Viewer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237365f0'/%3E%3Cg transform='translate(4 4)' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 6c0-1.1 3.6-2 8-2s8 .9 8 2-3.6 2-8 2-8-.9-8-2'/%3E%3Cpath d='M4 6v6c0 1.1 3.6 2 8 2s8-.9 8-2V6M4 12v6c0 1.1 3.6 2 8 2s8-.9 8-2v-6'/%3E%3C/g%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f4f5f7;
      --panel: #fff;
      --line: #d8dde6;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 5;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 18px; font-weight: 600; }
    .nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font: inherit;
    }
    button:hover { background: #f8fafc; }
    button:disabled { opacity: 0.45; cursor: default; }
    #counter { color: var(--muted); font-size: 14px; min-width: 120px; text-align: center; }
    .page-jump {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
    }
    .page-jump input {
      width: 64px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
    }
    .source-label {
      font-size: 12px;
      color: var(--muted);
      max-width: 320px;
    }
    .toolbar {
      padding: 12px 20px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .candidate-search {
      display: block;
      flex: 1 1 280px;
      max-width: 480px;
    }
    .candidate-search input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
      background: var(--panel);
      color: var(--text);
    }
    .candidate-search input:focus {
      outline: 2px solid var(--accent-soft);
      border-color: var(--accent);
    }
    .search-hint {
      font-size: 12px;
      color: var(--muted);
    }
    .collection-info {
      margin: 0 20px 28px;
      padding: 14px 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      display: grid;
      gap: 10px;
    }
    .collection-info h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }
    .collection-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px 16px;
      font-size: 13px;
    }
    .collection-grid dt { color: var(--muted); font-size: 11px; margin: 0; }
    .collection-grid dd { margin: 2px 0 0; word-break: break-word; }
    main { padding: 16px 20px 28px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }
    .panel h2 {
      margin: 0;
      padding: 12px 14px;
      font-size: 14px;
      border-bottom: 1px solid var(--line);
      background: #fafbfc;
    }
    .table-wrap { overflow: auto; max-height: calc(100vh - 220px); }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #fafbfc;
      color: var(--muted);
      font-weight: 600;
      position: sticky;
      top: 0;
    }
    td.message { white-space: pre-wrap; max-width: 420px; }
    .reply-quote {
      margin-bottom: 6px;
      padding: 6px 8px;
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
      border-radius: 0 6px 6px 0;
      font-size: 12px;
      color: var(--muted);
      white-space: pre-wrap;
    }
    .reply-quote b { color: var(--text); }
    .type-pills {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }
    .type-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      border: 1px solid var(--line);
      background: #f8fafc;
      color: var(--muted);
      white-space: nowrap;
    }
    .type-pill.request { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
    .type-pill.feedback { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
    .type-pill.question { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
    .type-pill.flood { background: #f3f4f6; color: #4b5563; border-color: #e5e7eb; }
    .user-cell {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-width: 180px;
    }
    .user-avatar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: 0 0 auto;
      max-width: 88px;
    }
    .user-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      padding: 0;
      overflow: hidden;
      border: 2px solid var(--line);
      background: var(--accent-soft);
      flex: 0 0 auto;
    }
    .user-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .user-btn .initials {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
    }
    .user-name { font-weight: 600; line-height: 1.3; }
    .active-phone {
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      word-break: break-all;
      line-height: 1.2;
    }
    .phones { color: var(--muted); font-size: 12px; margin-top: 2px; }
    td.subject-part { white-space: nowrap; }
    .balloon-cell { display: flex; flex-wrap: wrap; gap: 6px; max-width: 176px; }
    .balloon-btn {
      padding: 0;
      border: none;
      background: transparent;
      border-radius: 8px;
      line-height: 0;
      cursor: pointer;
      position: relative;
    }
    .balloon-btn:hover { opacity: 0.9; }
    .balloon-thumb {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #eee;
      display: block;
    }
    .balloon-btn .ordinal {
      position: absolute;
      bottom: 3px;
      right: 3px;
      padding: 0 5px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.75);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      line-height: 16px;
    }
    .gallery-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .gallery-nav span { color: var(--muted); font-size: 13px; }
    .empty {
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 20;
    }
    .modal.open { display: flex; }
    .modal-card {
      width: min(480px, 100%);
      background: var(--panel);
      border-radius: 14px;
      border: 1px solid var(--line);
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }
    .modal-card.wide { width: min(720px, 100%); }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }
    .modal-head h3 { margin: 0; font-size: 16px; }
    .modal-body { padding: 14px; display: grid; gap: 12px; }
    .profile-shot, .balloon-shot {
      width: 100%;
      object-fit: contain;
      background: #111;
      border-radius: 10px;
    }
    .profile-shot { max-height: 320px; }
    .balloon-shot { max-height: min(70vh, 640px); }
    .meta { display: grid; gap: 8px; font-size: 14px; }
    .meta dt { color: var(--muted); font-size: 12px; }
    .meta dd { margin: 2px 0 0; word-break: break-word; }
  </style>
</head>
<body>
  <header>
    <h1>Viber DB message viewer</h1>
    <div class="nav">
      <span class="source-label" id="sourceLabel">No data</span>
      <button id="firstBtn" type="button" disabled>⟵ First</button>
      <button id="prevBtn" type="button" disabled>← Prev</button>
      <div id="counter">—</div>
      <button id="nextBtn" type="button" disabled>Next →</button>
      <button id="lastBtn" type="button" disabled>Last ⟶</button>
      <label class="page-jump">Page
        <input id="pageInput" type="number" min="1" value="1">
      </label>
    </div>
  </header>

  <div class="toolbar">
    <label class="candidate-search" title="Fuzzy search by last name, first name, patronymic, or any combination">
      <input id="candidateSearch" type="search"
        placeholder="Search candidate (name / surname / patronymic)…"
        autocomplete="off" spellcheck="false">
    </label>
    <span class="search-hint" id="searchHint"></span>
  </div>

  <main>
    <div class="panel">
      <h2 id="pageTitle">Messages</h2>
      <div id="pageBody"><div class="empty">No messages</div></div>
    </div>
  </main>

  <section class="collection-info" id="collectionInfo">
    <h2>Database</h2>
    <dl class="collection-grid" id="collectionGrid"></dl>
  </section>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card" id="modalCard">
      <div class="modal-head">
        <h3 id="modalTitle">Details</h3>
        <button id="closeModal" type="button">Close</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="viewer-app.js"></script>
</body>
</html>
